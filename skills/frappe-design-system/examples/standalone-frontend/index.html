<!DOCTYPE html>
<html lang="en" data-dock="v16.50">
<head>
  <meta charset="utf-8" />
  <title>Cohenix</title>
  <link rel="stylesheet" href="../../tokens/variables.css" />
  <link rel="stylesheet" href="../../assets/templates/shell.css" />
</head>
<body>
  <div class="shell">
    <aside class="dock" aria-label="Main">
      <button class="dock-tile" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>
      </button>
      <div class="dock-rule"></div>
      <button class="dock-tile" type="button" aria-current="page" aria-label="Leave">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      </button>
      <button class="dock-tile" type="button" aria-label="Expenses">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
      </button>
    </aside>
    <aside class="sidebar" aria-label="Leave">
      <h1>Leave</h1>
      <a class="nav-item" aria-current="page" href="#balances">Balances</a>
      <a class="nav-item" href="#applications">Applications</a>
      <a class="nav-item" href="#team">Team</a>
    </aside>
    <div class="main">
      <header class="page-head">
        <div>
          <div class="crumbs">Leave</div>
          <div class="page-title">Balances</div>
        </div>
        <div class="actions">
          <button class="es-btn" data-variant="solid" type="button">Apply for leave</button>
        </div>
      </header>
      <div class="content">
        <div class="canvas">
          <p style="margin:0 0 12px; color:var(--ink-gray-5); font-size:var(--text-sm)">Alex Cohen · EPI-USE</p>
          <div class="grid-4">
            <article class="metric"><div class="label">Annual leave</div><div class="value">18</div><div class="hint">of 20 days</div></article>
            <article class="metric"><div class="label">Pending</div><div class="value">1</div><div class="hint">Awaiting approval</div></article>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
