<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Record</title>
  <link rel="stylesheet" href="../../tokens/variables.css" />
  <link rel="stylesheet" href="../../assets/templates/shell.css" />
</head>
<body>
  <div class="shell">
    <div class="main">
      <header class="page-head">
        <div class="page-title">Alex Cohen</div>
        <button class="es-btn" data-variant="solid" type="button">Save</button>
      </header>
      <div class="content">
        <div class="work">
          <div class="canvas">
            <section class="card" style="max-width:900px">
              <h2>Employment</h2>
              <div class="field"><div class="k">Company</div><div class="v">EPI-USE</div></div>
              <div class="field"><div class="k">Status</div><div class="v">Active</div></div>
            </section>
          </div>
          <aside class="panel" aria-label="Details">
            <header><h2>Details</h2></header>
            <div class="field"><div class="k">Assigned to</div><div class="v">Alex Cohen</div></div>
            <div class="field"><div class="k">Attachments</div><div class="v">0</div></div>
            <div class="field"><div class="k">Tags</div><div class="v"><span class="badge">People</span></div></div>
          </aside>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
