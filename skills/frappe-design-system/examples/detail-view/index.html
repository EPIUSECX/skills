<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee</title>
  <link rel="stylesheet" href="../../tokens/variables.css" />
  <link rel="stylesheet" href="../../assets/templates/shell.css" />
</head>
<body>
  <div class="shell">
    <div class="nav-scrim" data-nav-toggle></div>
    <aside class="dock" aria-label="Apps">
      <div class="dock-logo"><button class="dock-tile" type="button" aria-label="App menu"><span class="dock-mark">C</span></button></div>
      <div class="dock-rule" aria-hidden="true"></div>
      <div class="dock-items">
        <a class="dock-tile" href="#" aria-current="page" aria-label="People"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#users" /></svg></a>
        <a class="dock-tile" href="../dashboard/index.html" aria-label="Selling"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#store" /></svg></a>
      </div>
      <div class="dock-user"><button class="dock-tile" type="button" aria-label="Account"><span class="dock-avatar">AC</span></button></div>
    </aside>
    <nav class="sidebar" id="sidebar" aria-label="People">
      <div class="sidebar-header" role="button" tabindex="0" aria-haspopup="menu">
        <span class="title">People</span>
        <svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#chevron-down" /></svg>
      </div>
      <div class="sidebar-group">
        <a class="nav-item" href="#"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#search" /></svg><span class="label">Search</span></a>
        <a class="nav-item" href="#"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#bell" /></svg><span class="label">Notification</span></a>
      </div>
      <div class="sidebar-group">
        <a class="nav-item" href="#"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#house" /></svg><span class="label">Home</span></a>
        <a class="nav-item" href="#" aria-current="page"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#user" /></svg><span class="label">Employee</span></a>
        <a class="nav-item" href="#"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#calendar-days" /></svg><span class="label">Leave Application</span></a>
        <a class="nav-item" href="#"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#id-card" /></svg><span class="label">Reports</span><svg class="icon chevron"><use href="../../assets/icons/lucide-sprite.svg#chevron-right" /></svg></a>
      </div>
    </nav>
    <div class="main">
      <header class="page-head">
        <div>
          <button class="nav-toggle" type="button" data-nav-toggle aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#menu" /></svg></button>
          <nav class="crumbs" aria-label="Breadcrumb"><span aria-current="page">Employee</span></nav>
        </div>
        <div class="actions">
          <button class="es-btn" data-icon-only type="button" aria-label="Reload" title="Reload"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#refresh-cw" /></svg></button>
          <button class="es-btn" data-variant="solid" type="button"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#plus" /></svg>Add Employee</button>
        </div>
      </header>
      <div class="work">
        <main class="content">
          <div class="list-toolbar">
            <div>
              <input class="search" id="q" type="search" placeholder="Full Name" aria-label="Full Name" />
              <select class="input" id="status" aria-label="Status">
                <option value="">Status</option>
                <option>Active</option>
                <option>On Leave</option>
                <option>Left</option>
              </select>
            </div>
            <div>
              <button class="es-btn" type="button"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#funnel" /></svg>Filters</button>
              <button class="es-btn" data-icon-only type="button" aria-label="Sort" title="Sort"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#arrow-down-wide-narrow" /></svg></button>
            </div>
          </div>
          <div class="list" role="table" aria-label="Employees">
            <div class="list-head" role="row">
              <input class="checkbox" type="checkbox" id="all" aria-label="Select all" />
              <span class="col-subject" role="columnheader">Full Name</span>
              <span class="col col-status" role="columnheader">Status</span>
              <span class="col" role="columnheader">Department</span>
              <span class="col-end" role="columnheader" id="count"></span>
            </div>
            <div id="rows"></div>
          </div>
        </main>
        <aside class="panel" id="panel" aria-label="Employee details" aria-live="polite"></aside>
      </div>
    </div>
  </div>
  <script>
    const people = [
      { name: 'Alex Cohen', id: 'HR-EMP-00001', status: 'Active', dept: 'People', email: 'alex@cohenix.com', leave: '20 days' },
      { name: 'Sam Naidoo', id: 'HR-EMP-00002', status: 'On Leave', dept: 'Delivery', email: 'sam@cohenix.com', leave: '4 days' },
      { name: 'Riley Adams', id: 'HR-EMP-00003', status: 'Active', dept: 'Finance', email: 'riley@cohenix.com', leave: '12 days' },
      { name: 'Dana Moyo', id: 'HR-EMP-00004', status: 'Left', dept: 'Sales', email: 'dana@cohenix.com', leave: '0 days' },
    ]
    const theme = { Active: 'green', 'On Leave': 'amber', Left: 'red' }
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    let selected = people[0].id
    function render() {
      const q = document.getElementById('q').value.toLowerCase()
      const st = document.getElementById('status').value
      const rows = people.filter((p) => p.name.toLowerCase().includes(q) && (!st || p.status === st))
      document.getElementById('count').textContent = `${rows.length} of ${people.length}`
      document.getElementById('rows').innerHTML = rows.map((p) => `
        <div class="list-row" role="row" tabindex="0" data-id="${p.id}" aria-selected="${p.id === selected}">
          <input class="checkbox" type="checkbox" aria-label="Select ${esc(p.name)}" />
          <span class="col-subject" role="cell"><span class="subject">${esc(p.name)}</span><span class="row-meta">${esc(p.dept)}</span></span>
          <span class="col col-status" role="cell"><span class="badge" data-theme="${theme[p.status]}">${p.status}</span></span>
          <span class="col" role="cell">${esc(p.dept)}</span>
        </div>`).join('')
      const p = people.find((x) => x.id === selected)
      const panel = document.getElementById('panel')
      panel.hidden = !p
      if (p) panel.innerHTML = `
        <div class="panel-head"><h2>${esc(p.name)}</h2>
          <button class="es-btn" data-variant="ghost" data-icon-only type="button" id="close" aria-label="Close details"><svg class="icon"><use href="../../assets/icons/lucide-sprite.svg#x" /></svg></button></div>
        <dl class="fields">
          <dt>Employee</dt><dd>${p.id}</dd>
          <dt>Status</dt><dd><span class="badge" data-theme="${theme[p.status]}">${p.status}</span></dd>
          <dt>Department</dt><dd>${esc(p.dept)}</dd>
          <dt>Email</dt><dd>${esc(p.email)}</dd>
          <dt>Leave</dt><dd>${p.leave}</dd>
        </dl>`
    }
    document.getElementById('q').addEventListener('input', render)
    document.getElementById('status').addEventListener('change', render)
    document.getElementById('rows').addEventListener('click', (e) => {
      if (e.target.matches('.checkbox')) return
      const row = e.target.closest('.list-row')
      if (row) { selected = row.dataset.id; render() }
    })
    document.getElementById('rows').addEventListener('keydown', (e) => {
      const row = e.target.closest('.list-row')
      if (row && e.key === 'Enter') { selected = row.dataset.id; render(); document.querySelector(`[data-id="${selected}"]`).focus() }
    })
    document.getElementById('panel').addEventListener('click', (e) => { if (e.target.closest('#close')) { selected = null; render() } })
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) { selected = null; render() } })
    document.getElementById('all').addEventListener('change', (e) => document.querySelectorAll('#rows .checkbox').forEach((c) => (c.checked = e.target.checked)))
    render()
  </script>
  <script src="../../assets/templates/shell.js"></script>
</body>
</html>
