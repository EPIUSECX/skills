<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workforce</title>
  <link rel="stylesheet" href="../../tokens/variables.css" />
  <link rel="stylesheet" href="../../assets/templates/shell.css" />
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(20, minmax(0, 1fr));
      grid-auto-rows: 42px;
      gap: 0;
      margin-top: 8px;
    }
    .board .card { grid-column: span 10; grid-row: span 6; margin: 0; min-height: 0; overflow: hidden; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 160px; }
    .bars span { flex: 1; background: var(--surface-gray-3); border-radius: 4px 4px 0 0; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="dock" aria-label="Apps">
      <button class="dock-tile" type="button" aria-current="page" aria-label="Workforce">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      </button>
      <div class="dock-rule"></div>
      <button class="dock-tile" type="button" aria-label="People">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg>
      </button>
    </aside>
    <aside class="sidebar" aria-label="Workforce">
      <h1>Workforce</h1>
      <a class="nav-item" aria-current="page" href="#overview">Overview</a>
      <a class="nav-item" href="#people">People</a>
      <a class="nav-item" href="#leave">Leave</a>
    </aside>
    <div class="main">
      <header class="page-head">
        <div>
          <div class="crumbs">Workforce</div>
          <div class="page-title">Overview</div>
        </div>
        <div class="actions">
          <button class="es-btn" type="button">Refresh</button>
          <button class="es-btn" data-variant="solid" type="button">New</button>
        </div>
      </header>
      <div class="content">
        <div class="canvas">
          <div class="grid-4">
            <article class="metric"><div class="label">Headcount</div><div class="value">128</div><div class="hint">4 this month</div></article>
            <article class="metric"><div class="label">On leave</div><div class="value">6</div><div class="hint">Today</div></article>
            <article class="metric"><div class="label">Open requests</div><div class="value">11</div><div class="hint">3 waiting on you</div></article>
            <article class="metric"><div class="label">Attendance</div><div class="value">96%</div><div class="hint">Last 7 days</div></article>
          </div>
          <div class="board">
            <section class="card">
              <h2>Attendance</h2>
              <div class="bars" aria-hidden="true">
                <span style="height:40%"></span><span style="height:70%"></span><span style="height:55%"></span>
                <span style="height:80%"></span><span style="height:62%"></span><span style="height:48%"></span><span style="height:30%"></span>
              </div>
            </section>
            <section class="card">
              <h2>Requests</h2>
              <table class="data">
                <thead><tr><th>Person</th><th>Type</th><th>Status</th></tr></thead>
                <tbody>
                  <tr><td>Alex Cohen</td><td>Leave</td><td><span class="badge" data-theme="amber">Pending</span></td></tr>
                  <tr><td>Sam Naidoo</td><td>Expense</td><td><span class="badge" data-theme="green">Approved</span></td></tr>
                </tbody>
              </table>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
